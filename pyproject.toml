[project]
name = "business-graph-mcp"
version = "0.1.0"
description = "MCP server for a typed business-logic knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenny Zheng", email = "kenny.zheng@shinda.com.tw" }]
keywords = ["mcp", "knowledge-graph", "business-logic", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0,<3",
    "pyyaml>=6.0",
]

# 註：business_lint 的「未 commit 變更」檢查會呼叫系統 git 執行檔，那是作業系統層級
# 的相依，無法列在 dependencies；它為選用，缺少時該項檢查靜默跳過，
# 不影響其餘功能。

[project.urls]
Homepage = "https://github.com/zokmi/business-graph"
Issues = "https://github.com/zokmi/business-graph/issues"

[project.scripts]
business-graph-mcp = "business_graph_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    # test_packaging.py 會實際跑一次 `python -m build`，驗證 wheel 真的含有
    # schema.sql；這是測試套件本身的開發期相依，不該靠呼叫端每次記得加
    # --with build，否則標準的 `uv run pytest` 預設就是紅的。
    "build>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# scripts/ 是發佈用的輔助程式，不隨套件安裝，因此不在 src 的匯入路徑上；
# 加進 pythonpath 才能對它寫單元測試。
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# 本專案的註解、docstring 與錯誤訊息一律使用繁體中文，全形標點會被判定為
# 「與 ASCII 相似的模糊字元」。這在中文語境下是正確寫法而非錯誤。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
# scripts/ 一併納入：發佈流程壞掉的發現時機是「打了 tag 才知道」，成本比一般
# 開發期錯誤高，值得用同一套型別標準把關。
files = ["src", "scripts"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/business_graph_mcp"]

[tool.hatch.build.targets.wheel.force-include]
# schema.sql 隨套件安裝；以 importlib.resources 讀取，wheel 與 editable 安裝皆成立。
"src/business_graph_mcp/db/schema.sql" = "business_graph_mcp/db/schema.sql"

[tool.hatch.build.targets.sdist]
include = ["src/", "scripts/", "tests/", "README.md", "SETUP.md", "LICENSE", "pyproject.toml"]
